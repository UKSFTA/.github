version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"

  # Python (UKSFTA-Tools)
  - package-ecosystem: "pip"
    directory: "/UKSFTA-Tools"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"

  # Node.js (UKSFTA-Bot)
  - package-ecosystem: "npm"
    directory: "/UKSFTA-Bot"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"

  # .NET (UKSFTA-BIS)
  - package-ecosystem: "nuget"
    directory: "/UKSFTA-BIS"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"

  # Hugo (UKSFTA.github.io)
  - package-ecosystem: "npm"
    directory: "/UKSFTA.github.io"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
